# Tech Spec Generation Workflow
#
# Triggered when a PR is merged to develop with changes to product specs.
# Creates a GitHub issue and assigns it to Copilot with the create-tech-spec skill
# to convert product specs into technical specifications.
#
# Required Secrets:
#   COPILOT_PAT - Personal Access Token with the following permissions:
#     - repo (full control of private repositories)
#     - issues:write (to create and update issues)
#   This token is required because the default GITHUB_TOKEN cannot assign
#   issues to the Copilot agent due to GitHub's licensing restrictions.

name: 02 — Product Spec Ready

on:
  push:
    branches:
      - develop
    paths:
      - 'rnd/product_specs/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or ref to run against'
        required: true
        default: 'develop'
      file:
        description: 'Product spec file to process (e.g. rnd/product_specs/feature.md)'
        required: true

permissions:
  contents: read
  issues: write

jobs:
  detect-changes:
    name: Detect Product Spec Changes
    runs-on: ubuntu-latest
    outputs:
      product_specs_changed: ${{ steps.select.outputs.product_specs_changed }}
      changed_files: ${{ steps.select.outputs.changed_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Filter changed files
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          list-files: json
          filters: |
            product_specs:
              - added: 'rnd/product_specs/**'
              - added: 'r3nd/product_specs/**'
              - added: '**/rnd/product_specs/**'
              - added: '**/r3nd/product_specs/**'
      - name: Select changed files
        id: select
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            file="${{ github.event.inputs.file }}"
            if [[ ! -f "$file" ]]; then
              echo "File not found: $file" >&2
              exit 1
            fi
            printf 'product_specs_changed=true\n' >> "$GITHUB_OUTPUT"
            printf 'changed_files=["%s"]\n' "${file//\"/\\\"}" >> "$GITHUB_OUTPUT"
          else
            echo "product_specs_changed=${{ steps.filter.outputs.product_specs }}" >> "$GITHUB_OUTPUT"
            echo "changed_files=${{ steps.filter.outputs.product_specs_files }}" >> "$GITHUB_OUTPUT"
          fi

  create-tech-spec-task:
    name: Create Tech Spec Task
    needs: detect-changes
    if: needs.detect-changes.outputs.product_specs_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create-issue.outputs.issue_number }}
    steps:
      - name: Create issue for tech spec generation
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            // Safely parse changed_files output (may be empty, malformed JSON,
            // or a bracketed list like [rnd/tech_specs/foo.md] without quotes)
            function parseChangedFilesRaw(raw) {
              if (!raw) return [];
              raw = String(raw).trim();
              // Try JSON first
              try {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) return parsed;
              } catch (e) {
                // fall through to fallback
              }

              // Fallback: normalize bracketed unquoted lists and simple lists
              // Remove surrounding brackets if present
              const inner = raw.replace(/^\[|\]$/g, '').trim();
              if (!inner) return [];
              // Split on commas or whitespace, then strip quotes
              const parts = inner.split(/,\s*|\s+/).map(s => s.trim()).filter(Boolean).map(s => s.replace(/^['"]|['"]$/g, ''));
              return parts;
            }

            let changedFiles = [];
            try {
              const raw = '${{ needs.detect-changes.outputs.changed_files }}' || '';
              changedFiles = parseChangedFilesRaw(raw);
              if (!Array.isArray(changedFiles)) changedFiles = [];
            } catch (err) {
              core.notice('Failed to parse changed_files; defaulting to empty array.');
              changedFiles = [];
            }

            // Build the issue body with file locations
            const fileList = changedFiles.map(file => '- `' + file + '`').join('\n');
            const firstFile = changedFiles[0] || 'rnd/product_specs/';
            const specName = firstFile.split('/').pop().replace('.md', '');
            
            // Determine the spec directory (rnd or r3nd) from the file path
            const specDirMatch = firstFile.match(/(?:^|\/)(rnd|r3nd)\//);
            const specDir = specDirMatch ? specDirMatch[1] : 'r3nd';
            
            const issueTitle = 'Tech Spec: ' + specName;
            const issueBody = [
              '## Task: Create Tech Spec',
              '',
              '> **Task Skill:** `.github/skills/create-tech-spec/SKILL.md`',
              '',
              'A product specification has been added or updated. Please create the corresponding technical specification.',
              '',
              '### Product Spec File(s)',
              fileList,
              '',
              '### Instructions',
              '1. Read and follow the task skill at `.github/skills/create-tech-spec/SKILL.md`',
              '2. Read the product specification(s) listed above',
              '3. Use the template at `' + specDir + '/templates/tech_spec.md` as the base for the tech spec',
              '4. Output the tech spec to `' + specDir + '/tech_specs/` following the naming convention',
              '',
              '### Context',
              'This task was automatically created by the Tech Spec workflow when changes were detected in the product specs directory.'
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['tech-spec', 'copilot']
            });
            
            console.log('Created issue #' + issue.data.number + ': ' + issue.data.title);
            core.setOutput('issue_number', issue.data.number);
            return issue.data.number;

  assign-to-copilot:
    name: Assign to Copilot
    needs: create-tech-spec-task
    runs-on: ubuntu-latest
    steps:
      # The issue is assigned to Copilot and steered by the task skill
      # referenced in the issue body.
      - name: Assign issue to Copilot
        uses: otto-de/assign_issue_toCopilot_action@v1.0.1
        with:
          issue_number: ${{ needs.create-tech-spec-task.outputs.issue_number }}
          github_token: ${{ secrets.COPILOT_PAT }}
